<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Workspace Personal - Estilo Notion</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DATOS INICIALES POR DEFECTO ---
    const INITIAL_DATA = {
      materias: [
        {
          id: 'm1',
          nombre: 'Análisis Matemático II',
          profesor: 'Prof. García',
          color: 'indigo',
          parciales: [
            { id: 'p1', titulo: 'Primer Parcial', fecha: '2026-09-15', hora: '18:00', aula: 'Aula 302', nota: '', tema: 'Integrales dobles y triples' }
          ],
          tareas: [
            { id: 't1', titulo: 'Resolver Guía 4 de Integrales', estado: 'Pendiente', prioridad: 'Alta', fecha: '2026-09-05' }
          ],
          notas: [
            { id: 'n1', titulo: 'Fórmulas para cambio de variables', contenido: 'Recuerda usar el Jacobiano al pasar a coordenadas polares o esféricas.' }
          ]
        },
        {
          id: 'm2',
          nombre: 'Programación de Software',
          profesor: 'Ing. Martínez',
          color: 'emerald',
          parciales: [
            { id: 'p2', titulo: 'Entrega TP Integrador', fecha: '2026-09-20', hora: '23:59', aula: 'Virtual', nota: '', tema: 'Backend API REST' }
          ],
          tareas: [
            { id: 't2', titulo: 'Crear endpoints de usuarios', estado: 'En Progreso', prioridad: 'Media', fecha: '2026-09-10' }
          ],
          notas: [
            { id: 'n2', titulo: 'Arquitectura limpia', contenido: 'Separar capa de dominio, infraestructura y controladores.' }
          ]
        }
      ],
      vidaDiaria: {
        todos: [
          { id: 'v1', titulo: 'Renovar registro de conducir', categoria: 'Trámites', completado: false, prioridad: 'Alta', fecha: '2026-09-02' },
          { id: 'v2', titulo: 'Comprar comida para el gato', categoria: 'Compras', completado: true, prioridad: 'Baja', fecha: '' }
        ],
        recordatorios: [
          { id: 'r1', titulo: 'Pagar servicio de Internet', detalle: 'Vence el día 10 del mes', color: 'amber' },
          { id: 'r2', titulo: 'Turno Médico', detalle: 'Dentista a las 16:30 hs en la clínica central', color: 'rose' }
        ]
      }
    };

    // Helper para generar enlaces a Google Calendar
    function buildGoogleCalendarLink(title, details, dateStr, timeStr = '09:00') {
      if (!dateStr) return '#';
      const cleanDate = dateStr.replace(/-/g, '');
      const cleanTime = timeStr.replace(':', '') + '00';
      const startIso = `${cleanDate}T${cleanTime}`;
      // Asumimos 1 hora de duración por defecto
      const endHour = String(parseInt(timeStr.split(':')[0] || '09') + 1).padStart(2, '0');
      const endIso = `${cleanDate}T${endHour}${timeStr.split(':')[1] || '00'}00`;

      const baseUrl = 'https://calendar.google.com/calendar/render';
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title,
        details: details || 'Añadido desde mi Workspace Notion',
        dates: `${startIso}/${endIso}`
      });
      return `${baseUrl}?${params.toString()}`;
    }

    // Modal reutilizable
    function Modal({ isOpen, onClose, title, children }) {
      if (!isOpen) return null;
      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
              <h3 class="font-bold text-lg text-slate-100">{title}</h3>
              <button onClick={onClose} class="text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-xl"></i>
              </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[80vh]">
              {children}
            </div>
          </div>
        </div>
      );
    }

    // APP PRINCIPAL
    function App() {
      // Carga inicial desde localStorage
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('NOTION_WORKSPACE_DATA');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return INITIAL_DATA;
      });

      // Secciones: 'dashboard', 'facultad', 'materia_ID', 'vidadiaria', 'calendario'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedMateriaId, setSelectedMateriaId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(true);

      // Guardar en localStorage ante cambios
      useEffect(() => {
        localStorage.setItem('NOTION_WORKSPACE_DATA', JSON.stringify(data));
      }, [data]);

      // Modales de creación
      const [isAddMateriaOpen, setIsAddMateriaOpen] = useState(false);
      const [newMateriaName, setNewMateriaName] = useState('');
      const [newMateriaProf, setNewMateriaProf] = useState('');
      const [newMateriaColor, setNewMateriaColor] = useState('indigo');

      // Handlers de Materias
      const handleAddMateria = (e) => {
        e.preventDefault();
        if (!newMateriaName.trim()) return;
        const newMateria = {
          id: 'm_' + Date.now(),
          nombre: newMateriaName,
          profesor: newMateriaProf,
          color: newMateriaColor,
          parciales: [],
          tareas: [],
          notas: []
        };
        setData(prev => ({ ...prev, materias: [...prev.materias, newMateria] }));
        setNewMateriaName('');
        setNewMateriaProf('');
        setIsAddMateriaOpen(false);
        setActiveTab(`materia_${newMateria.id}`);
        setSelectedMateriaId(newMateria.id);
      };

      const handleDeleteMateria = (materiaId) => {
        if (confirm('¿Estás seguro de eliminar esta materia? Se perderán sus parciales y tareas.')) {
          setData(prev => ({
            ...prev,
            materias: prev.materias.filter(m => m.id !== materiaId)
          }));
          if (selectedMateriaId === materiaId) {
            setActiveTab('facultad');
            setSelectedMateriaId(null);
          }
        }
      };

      const currentMateria = useMemo(() => {
        return data.materias.find(m => m.id === selectedMateriaId) || null;
      }, [data.materias, selectedMateriaId]);

      // Resetear datos a muestra
      const handleResetData = () => {
        if (confirm('¿Restablecer datos de ejemplo? Perderás los cambios actuales.')) {
          setData(INITIAL_DATA);
        }
      };

      return (
        <div class="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
          {/* SIDEBAR */}
          <aside class={`${sidebarOpen ? 'w-64' : 'w-20'} bg-slate-900 border-r border-slate-800 transition-all duration-300 flex flex-col shrink-0 z-20`}>
            {/* Header Sidebar */}
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
              <div class={`flex items-center gap-3 overflow-hidden ${!sidebarOpen && 'justify-center w-full'}`}>
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black shadow-lg shadow-indigo-500/20 shrink-0">
                  <i class="fa-solid fa-cube text-lg"></i>
                </div>
                {sidebarOpen && (
                  <div>
                    <h1 class="font-bold text-sm tracking-wide leading-none text-slate-100">MyWorkspace</h1>
                    <span class="text-[11px] text-slate-400 font-medium">Estilo Notion</span>
                  </div>
                )}
              </div>
              <button onClick={() => setSidebarOpen(!sidebarOpen)} class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition hidden md:block">
                <i class={`fa-solid ${sidebarOpen ? 'fa-chevron-left' : 'fa-chevron-right'}`}></i>
              </button>
            </div>

            {/* Navigation Menu */}
            <div class="flex-1 overflow-y-auto p-3 space-y-6">
              {/* General Section */}
              <div>
                {sidebarOpen && <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 px-2">Principal</p>}
                <nav class="space-y-1">
                  <button
                    onClick={() => { setActiveTab('dashboard'); setSelectedMateriaId(null); }}
                    class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                  >
                    <i class="fa-solid fa-house text-base w-5 text-center"></i>
                    {sidebarOpen && <span>Dashboard</span>}
                  </button>

                  <button
                    onClick={() => { setActiveTab('calendario'); setSelectedMateriaId(null); }}
                    class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition ${activeTab === 'calendario' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                  >
                    <i class="fa-solid fa-calendar-days text-base w-5 text-center"></i>
                    {sidebarOpen && <span>Calendario</span>}
                  </button>
                </nav>
              </div>

              {/* Facultad Section */}
              <div>
                <div class="flex items-center justify-between mb-2 px-2">
                  {sidebarOpen && <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Facultad</p>}
                  {sidebarOpen && (
                    <button onClick={() => setIsAddMateriaOpen(true)} class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold p-0.5 rounded hover:bg-slate-800 transition">
                      <i class="fa-solid fa-plus"></i>
                    </button>
                  )}
                </div>
                <nav class="space-y-1">
                  <button
                    onClick={() => { setActiveTab('facultad'); setSelectedMateriaId(null); }}
                    class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition ${activeTab === 'facultad' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                  >
                    <i class="fa-solid fa-graduation-cap text-base w-5 text-center"></i>
                    {sidebarOpen && <span>Vista General</span>}
                  </button>

                  {/* Sub-lista de Materias */}
                  {data.materias.map(m => {
                    const isSelected = activeTab === `materia_${m.id}`;
                    return (
                      <button
                        key={m.id}
                        onClick={() => { setActiveTab(`materia_${m.id}`); setSelectedMateriaId(m.id); }}
                        class={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium transition ${isSelected ? 'bg-slate-800 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'}`}
                      >
                        <span class={`w-2.5 h-2.5 rounded-full bg-${m.color || 'indigo'}-400 shrink-0`}></span>
                        {sidebarOpen && <span class="truncate">{m.nombre}</span>}
                      </button>
                    );
                  })}
                </nav>
              </div>

              {/* Vida Diaria Section */}
              <div>
                {sidebarOpen && <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 px-2">Personal</p>}
                <nav class="space-y-1">
                  <button
                    onClick={() => { setActiveTab('vidadiaria'); setSelectedMateriaId(null); }}
                    class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition ${activeTab === 'vidadiaria' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                  >
                    <i class="fa-solid fa-user-check text-base w-5 text-center"></i>
                    {sidebarOpen && <span>Vida Diaria</span>}
                  </button>
                </nav>
              </div>
            </div>

            {/* Footer Sidebar */}
            <div class="p-3 border-t border-slate-800">
              <button onClick={handleResetData} class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-xs text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
                <i class="fa-solid fa-rotate-left"></i>
                {sidebarOpen && <span>Restablecer Datos</span>}
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 flex flex-col overflow-y-auto bg-slate-950">
            {activeTab === 'dashboard' && <DashboardView data={data} setData={setData} setActiveTab={setActiveTab} setSelectedMateriaId={setSelectedMateriaId} />}
            {activeTab === 'facultad' && <FacultadGeneralView data={data} setData={setData} setActiveTab={setActiveTab} setSelectedMateriaId={setSelectedMateriaId} setIsAddMateriaOpen={setIsAddMateriaOpen} />}
            {activeTab.startsWith('materia_') && currentMateria && (
              <MateriaDetailView materia={currentMateria} data={data} setData={setData} onDelete={handleDeleteMateria} />
            )}
            {activeTab === 'vidadiaria' && <VidaDiariaView data={data} setData={setData} />}
            {activeTab === 'calendario' && <CalendarioView data={data} />}
          </main>

          {/* MODAL NUEVA MATERIA */}
          <Modal isOpen={isAddMateriaOpen} onClose={() => setIsAddMateriaOpen(false)} title="Agregar Nueva Materia">
            <form onSubmit={handleAddMateria} class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre de la Materia</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Física I, Álgebra..."
                  value={newMateriaName}
                  onChange={(e) => setNewMateriaName(e.target.value)}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Profesor / Cátedra</label>
                <input
                  type="text"
                  placeholder="Ej: Lic. Ramírez"
                  value={newMateriaProf}
                  onChange={(e) => setNewMateriaProf(e.target.value)}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Color distintivo</label>
                <div class="flex gap-3 mt-2">
                  {['indigo', 'emerald', 'amber', 'rose', 'sky', 'purple'].map(color => (
                    <button
                      type="button"
                      key={color}
                      onClick={() => setNewMateriaColor(color)}
                      class={`w-8 h-8 rounded-full bg-${color}-500 flex items-center justify-center transition border-2 ${newMateriaColor === color ? 'border-white scale-110' : 'border-transparent opacity-70 hover:opacity-100'}`}
                    >
                      {newMateriaColor === color && <i class="fa-solid fa-check text-xs text-white"></i>}
                    </button>
                  ))}
                </div>
              </div>

              <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                <button type="button" onClick={() => setIsAddMateriaOpen(false)} class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30 transition">Guardar Materia</button>
              </div>
            </form>
          </Modal>
        </div>
      );
    }

    // --- VISTA: DASHBOARD PRINCIPAL ---
    function DashboardView({ data, setData, setActiveTab, setSelectedMateriaId }) {
      // Recopilar próximos parciales
      const proximosParciales = useMemo(() => {
        let list = [];
        data.materias.forEach(m => {
          m.parciales.forEach(p => {
            list.push({ ...p, materiaNombre: m.nombre, materiaColor: m.color, materiaId: m.id });
          });
        });
        return list.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
      }, [data.materias]);

      // Tareas urgentes o pendientes de Facultad y Personal
      const tareasPendientesCount = useMemo(() => {
        let count = 0;
        data.materias.forEach(m => {
          count += m.tareas.filter(t => t.estado !== 'Completado').length;
        });
        count += data.vidaDiaria.todos.filter(t => !t.completado).length;
        return count;
      }, [data]);

      return (
        <div class="p-8 max-w-6xl w-full mx-auto space-y-8">
          {/* Header Banner */}
          <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-900/60 via-slate-900 to-slate-900 border border-indigo-500/20 p-8">
            <div class="relative z-10">
              <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-3">
                Workspace Notion
              </span>
              <h2 class="text-3xl font-extrabold text-white tracking-tight">¡Hola! Listo para organizar tu día</h2>
              <p class="text-slate-400 text-sm mt-1 max-w-xl">
                Tenés <strong class="text-indigo-400">{proximosParciales.length} parciales agendados</strong> y <strong class="text-indigo-400">{tareasPendientesCount} tareas pendientes</strong>.
              </p>
            </div>
            <div class="absolute -right-10 -bottom-10 w-60 h-60 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
          </div>

          {/* Grid de Métricas Rápida */}
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
              <div>
                <p class="text-xs font-semibold text-slate-400">Materias Activas</p>
                <h3 class="text-2xl font-black text-slate-100 mt-1">{data.materias.length}</h3>
              </div>
              <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-book-bookmark text-xl"></i>
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
              <div>
                <p class="text-xs font-semibold text-slate-400">Próximos Exámenes</p>
                <h3 class="text-2xl font-black text-indigo-400 mt-1">{proximosParciales.length}</h3>
              </div>
              <div class="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
                <i class="fa-solid fa-calendar-check text-xl"></i>
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
              <div>
                <p class="text-xs font-semibold text-slate-400">Recordatorios Activos</p>
                <h3 class="text-2xl font-black text-amber-400 mt-1">{data.vidaDiaria.recordatorios.length}</h3>
              </div>
              <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
                <i class="fa-solid fa-note-sticky text-xl"></i>
              </div>
            </div>
          </div>

          {/* Dos Columnas: Próximos Parciales & Recordatorios Rápido */}
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Próximos Parciales */}
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-4">
                  <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-clock text-indigo-400"></i> Próximos Parciales
                  </h3>
                  <button onClick={() => setActiveTab('facultad')} class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Ver Todo</button>
                </div>

                {proximosParciales.length === 0 ? (
                  <p class="text-xs text-slate-500 italic py-4">No hay parciales agendados.</p>
                ) : (
                  <div class="space-y-3">
                    {proximosParciales.slice(0, 3).map(p => (
                      <div key={p.id} class="bg-slate-950/60 border border-slate-800 p-3.5 rounded-xl flex items-center justify-between">
                        <div>
                          <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-400">{p.materiaNombre}</span>
                          <h4 class="font-bold text-sm text-slate-200">{p.titulo}</h4>
                          <p class="text-xs text-slate-400 mt-0.5"><i class="fa-regular fa-clock text-[10px] mr-1"></i> {p.fecha} - {p.hora || 'Hs a confirmar'} ({p.aula || 'S/A'})</p>
                        </div>
                        <a
                          href={buildGoogleCalendarLink(p.titulo, `Parcial de ${p.materiaNombre} - Aula: ${p.aula}`, p.fecha, p.hora)}
                          target="_blank"
                          rel="noopener noreferrer"
                          class="px-2.5 py-1.5 bg-indigo-600/20 border border-indigo-500/30 hover:bg-indigo-600 hover:text-white text-indigo-300 text-xs font-semibold rounded-lg transition flex items-center gap-1.5"
                          title="Sincronizar en Google Calendar"
                        >
                          <i class="fa-brands fa-google text-xs"></i> Cal
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Recordatorios Rápidos */}
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
              <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">

    // --- VISTA: DETALLE DE MATERIA INDIVIDUAL ---
    function MateriaDetailView({ materia, data, setData, onDelete }) {
      const [subTab, setSubTab] = useState('parciales'); // 'parciales', 'tareas', 'notas'

      // Estados para Formularios
      const [isParcialModalOpen, setIsParcialModalOpen] = useState(false);
      const [isTareaModalOpen, setIsTareaModalOpen] = useState(false);
      const [isNotaModalOpen, setIsNotaModalOpen] = useState(false);

      // Form Parcial
      const [pTitulo, setPTitulo] = useState('');
      const [pFecha, setPFecha] = useState('');
      const [pHora, setPHora] = useState('');
      const [pAula, setPAula] = useState('');

      // Form Tarea
      const [tTitulo, setTTitulo] = useState('');
      const [tPrioridad, setTPrioridad] = useState('Media');
      const [tFecha, setTFecha] = useState('');

      // Form Nota
      const [nTitulo, setNTitulo] = useState('');
      const [nContenido, setNContenido] = useState('');

      // Handlers de Guardado
      const handleAddParcial = (e) => {
        e.preventDefault();
        const newP = { id: 'p_' + Date.now(), titulo: pTitulo, fecha: pFecha, hora: pHora, aula: pAula, nota: '' };
        updateMateria({ ...materia, parciales: [...materia.parciales, newP] });
        setPTitulo(''); setPFecha(''); setPHora(''); setPAula('');
        setIsParcialModalOpen(false);
      };

      const handleAddTarea = (e) => {
        e.preventDefault();
        const newT = { id: 't_' + Date.now(), titulo: tTitulo, estado: 'Pendiente', prioridad: tPrioridad, fecha: tFecha };
        updateMateria({ ...materia, tareas: [...materia.tareas, newT] });
        setTTitulo('');
        setIsTareaModalOpen(false);
      };

      const handleAddNota = (e) => {
        e.preventDefault();
        const newN = { id: 'n_' + Date.now(), titulo: nTitulo, contenido: nContenido };
        updateMateria({ ...materia, notas: [...materia.notas, newN] });
        setNTitulo(''); setNContenido('');
        setIsNotaModalOpen(false);
      };

      const updateMateria = (updatedM) => {
        setData(prev => ({
          ...prev,
          materias: prev.materias.map(m => m.id === updatedM.id ? updatedM : m)
        }));
      };

      const toggleTareaEstado = (tareaId) => {
        const updatedTareas = materia.tareas.map(t => {
          if (t.id === tareaId) {
            const nextState = t.estado === 'Pendiente' ? 'En Progreso' : t.estado === 'En Progreso' ? 'Completado' : 'Pendiente';
            return { ...t, estado: nextState };
          }
          return t;
        });
        updateMateria({ ...materia, tareas: updatedTareas });
      };

      return (
        <div class="p-8 max-w-6xl w-full mx-auto space-y-6">
          {/* Header de la Materia */}
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-4">
              <div class={`w-4 h-12 rounded-full bg-${materia.color || 'indigo'}-500`}></div>
              <div>
                <h2 class="text-2xl font-black text-slate-100">{materia.nombre}</h2>
                <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-user-tie mr-1"></i> {materia.profesor || 'Sin Profesor designado'}</p>
              </div>
            </div>

            <button
              onClick={() => onDelete(materia.id)}
              class="px-3 py-1.5 text-xs text-rose-400 hover:text-white hover:bg-rose-600/20 rounded-lg border border-rose-500/30 transition"
            >
              <i class="fa-solid fa-trash mr-1"></i> Eliminar Materia
            </button>
          </div>

          {/* Nav Tabs */}
          <div class="flex border-b border-slate-800 gap-6 text-sm font-semibold text-slate-400">
            <button
              onClick={() => setSubTab('parciales')}
              class={`pb-3 transition flex items-center gap-2 ${subTab === 'parciales' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'hover:text-slate-200'}`}
            >
              <i class="fa-solid fa-calendar-check"></i> Parciales y Exámenes ({materia.parciales.length})
            </button>
            <button
              onClick={() => setSubTab('tareas')}
              class={`pb-3 transition flex items-center gap-2 ${subTab === 'tareas' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'hover:text-slate-200'}`}
            >
              <i class="fa-solid fa-list-check"></i> Tareas y TP ({materia.tareas.length})
            </button>
            <button
              onClick={() => setSubTab('notas')}
              class={`pb-3 transition flex items-center gap-2 ${subTab === 'notas' ? 'text-indigo-400 border-b-2 border-indigo-500' : 'hover:text-slate-200'}`}
            >
              <i class="fa-solid fa-note-sticky"></i> Apuntes / Notas ({materia.notas.length})
            </button>
          </div>

          {/* TAB 1: PARCIALES */}
          {subTab === 'parciales' && (
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-200">Fechas de Parciales y Entregas</h3>
                <button

                  class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-md transition flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-plus"></i> Agendar Parcial
                </button>
              </div>

              {materia.parciales.length === 0 ? (
                <div class="p-8 text-center bg-slate-900 border border-slate-800 rounded-2xl text-slate-500 text-xs">
                  No tenés exámenes registrados en esta materia.
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {materia.parciales.map(p => (
                    <div key={p.id} class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                      <div>
                        <div class="flex justify-between items-start">
                          <h4 class="font-bold text-slate-100">{p.titulo}</h4>
                          <a
                            href={buildGoogleCalendarLink(`${p.titulo} - ${materia.nombre}`, `Aula: ${p.aula}`, p.fecha, p.hora)}
                            target="_blank"
                            rel="noopener noreferrer"
                            class="px-2.5 py-1 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white text-xs font-semibold rounded-lg border border-indigo-500/30 transition flex items-center gap-1"
                          >
                            <i class="fa-brands fa-google text-[11px]"></i> Sincronizar
                          </a>
                        </div>

                        <div class="mt-3 space-y-1 text-xs text-slate-400">
                          <p><i class="fa-solid fa-calendar mr-2 text-indigo-400"></i> Fecha: <strong class="text-slate-200">{p.fecha}</strong></p>
                          {p.hora && <p><i class="fa-solid fa-clock mr-2 text-indigo-400"></i> Hora: <strong class="text-slate-200">{p.hora}</strong></p>}
                          {p.aula && <p><i class="fa-solid fa-location-dot mr-2 text-indigo-400"></i> Aula/Lugar: <strong class="text-slate-200">{p.aula}</strong></p>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* TAB 2: TAREAS */}
          {subTab === 'tareas' && (
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-200">Tareas Pendientes</h3>
                <button
                  onClick={() => setIsTareaModalOpen(true)}
                  class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-md transition flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-plus"></i> Nueva Tarea
                </button>
              </div>

              {materia.tareas.length === 0 ? (
                <div class="p-8 text-center bg-slate-900 border border-slate-800 rounded-2xl text-slate-500 text-xs">
                  No tenés tareas agregadas para esta materia.
                </div>
              ) : (
                <div class="space-y-2">
                  {materia.tareas.map(t => (
                    <div key={t.id} class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                      <div class="flex items-center gap-3">
                        <button
                          onClick={() => toggleTareaEstado(t.id)}
                          class={`w-5 h-5 rounded-md border flex items-center justify-center transition ${t.estado === 'Completado' ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600 text-transparent hover:border-slate-400'}`}
                        >
                          <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        <span class={`text-sm ${t.estado === 'Completado' ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}`}>
                          {t.titulo}
                        </span>
                      </div>

                      <div class="flex items-center gap-3 text-xs">
                        {t.fecha && <span class="text-slate-400"><i class="fa-regular fa-clock mr-1"></i> {t.fecha}</span>}
                        <span class={`px-2 py-0.5 rounded-full text-[10px] font-bold ${t.estado === 'Completado' ? 'bg-slate-800 text-slate-400' : t.estado === 'En Progreso' ? 'bg-amber-500/20 text-amber-300' : 'bg-indigo-500/20 text-indigo-300'}`}>
                          {t.estado}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* TAB 3: APUNTES */}
          {subTab === 'notas' && (
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-200">Apuntes Rápida</h3>
                <button
                  onClick={() => setIsNotaModalOpen(true)}
                  class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-md transition flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-plus"></i> Crear Apunte
                </button>
              </div>

              {materia.notas.length === 0 ? (
                <div class="p-8 text-center bg-slate-900 border border-slate-800 rounded-2xl text-slate-500 text-xs">
                  No tenés notas redactadas en esta materia.
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {materia.notas.map(n => (
                    <div key={n.id} class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                      <h4 class="font-bold text-sm text-indigo-300 mb-2">{n.titulo}</h4>
                      <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">{n.contenido}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* MODALES LOCALES */}
          {/* Modal Parcial */}
          <Modal isOpen={isParcialModalOpen} onClose={() => setIsParcialModalOpen(false)} title="Agendar Parcial / Examen">
            <form onSubmit={handleAddParcial} class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Título del Parcial</label>
                <input type="text" required placeholder="Ej: Primer Parcial, Entregable Final" value={pTitulo} onChange={e => setPTitulo(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">Fecha</label>
                  <input type="date" required value={pFecha} onChange={e => setPFecha(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">Hora</label>
                  <input type="time" value={pHora} onChange={e => setPHora(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Aula / Salón</label>
                <input type="text" placeholder="Ej: Aula 104" value={pAula} onChange={e => setPAula(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
              </div>
              <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                <button type="button" onClick={() => setIsParcialModalOpen(false)} class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg">Guardar</button>
              </div>
            </form>
          </Modal>

          {/* Modal Tarea */}
          <Modal isOpen={isTareaModalOpen} onClose={() => setIsTareaModalOpen(false)} title="Agregar Tarea de Facultad">
            <form onSubmit={handleAddTarea} class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Descripción de la Tarea</label>
                <input type="text" required placeholder="Ej: Resolver ejercicio 3..." value={tTitulo} onChange={e => setTTitulo(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">Prioridad</label>
                  <select value={tPrioridad} onChange={e => setTPrioridad(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none">
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">Fecha Límite</label>
                  <input type="date" value={tFecha} onChange={e => setTFecha(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none" />
                </div>
              </div>
              <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                <button type="button" onClick={() => setIsTareaModalOpen(false)} class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400">Cancelar</button>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg">Guardar Tarea</button>
              </div>
            </form>
          </Modal>

          {/* Modal Nota */}
          <Modal isOpen={isNotaModalOpen} onClose={() => setIsNotaModalOpen(false)} title="Nuevo Apunte">
            <form onSubmit={handleAddNota} class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Título</label>
                <input type="text" required placeholder="Ej: Resumen Tema 2..." value={nTitulo} onChange={e => setNTitulo(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />

              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Contenido / Apunte</label>

              <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">

          </Modal>

    // --- VISTA: VIDA DIARIA / PERSONAL ---
    function VidaDiariaView({ data, setData }) {
      const [newTodo, setNewTodo] = useState('');
      const [newCategoria, setNewCategoria] = useState('Personal');

      const [newRecTitulo, setNewRecTitulo] = useState('');
      const [newRecDetalle, setNewRecDetalle] = useState('');

      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!newTodo.trim()) return;
        const item = { id: 'v_' + Date.now(), titulo: newTodo, categoria: newCategoria, completado: false, prioridad: 'Media', fecha: '' };
        setData(prev => ({
          ...prev,
          vidaDiaria: { ...prev.vidaDiaria, todos: [item, ...prev.vidaDiaria.todos] }
        }));
        setNewTodo('');
      };

      const toggleTodo = (id) => {
        setData(prev => ({
          ...prev,
          vidaDiaria: {
            ...prev.vidaDiaria,
            todos: prev.vidaDiaria.todos.map(t => t.id === id ? { ...t, completado: !t.completado } : t)
          }
        }));
      };

      const handleAddRecordatorio = (e) => {
        e.preventDefault();
        if (!newRecTitulo.trim()) return;
        const item = { id: 'r_' + Date.now(), titulo: newRecTitulo, detalle: newRecDetalle, color: 'amber' };
        setData(prev => ({
          ...prev,
          vidaDiaria: { ...prev.vidaDiaria, recordatorios: [...prev.vidaDiaria.recordatorios, item] }
        }));
        setNewRecTitulo(''); setNewRecDetalle('');
      };

      const deleteRecordatorio = (id) => {
        setData(prev => ({
          ...prev,
          vidaDiaria: {
            ...prev.vidaDiaria,
            recordatorios: prev.vidaDiaria.recordatorios.filter(r => r.id !== id)
          }
        }));
      };

      return (
        <div class="p-8 max-w-6xl w-full mx-auto space-y-8">
          <div>
            <h2 class="text-2xl font-extrabold text-slate-100">Vida Diaria & Organización</h2>
            <p class="text-xs text-slate-400 mt-1">Tu lista de cosas por hacer y notas rápidas que no tenés que olvidar.</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {/* TO DO LIST */}
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">
              <h3 class="font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-indigo-400"></i> Lista de Tareas (To-Do)
              </h3>

              {/* Form Input Todo */}
              <form onSubmit={handleAddTodo} class="flex gap-2">
                <input
                  type="text"
                  placeholder="Agregar nueva tarea..."
                  value={newTodo}
                  onChange={e => setNewTodo(e.target.value)}
                  class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                />
                <select
                  value={newCategoria}
                  onChange={e => setNewCategoria(e.target.value)}
                  class="bg-slate-800 border border-slate-700 rounded-xl px-2 text-xs text-slate-300 focus:outline-none"
                >
                  <option value="Personal">Personal</option>
                  <option value="Trámites">Trámites</option>
                  <option value="Compras">Compras</option>
                  <option value="Salud">Salud</option>
                </select>
                <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </form>

              {/* List */}
              <div class="space-y-2 max-h-96 overflow-y-auto">
                {data.vidaDiaria.todos.map(t => (
                  <div key={t.id} class="p-3 bg-slate-950/60 border border-slate-800 rounded-xl flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <button
                        onClick={() => toggleTodo(t.id)}
                        class={`w-5 h-5 rounded-md border flex items-center justify-center transition ${t.completado ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-700 hover:border-slate-400'}`}
                      >
                        <i class="fa-solid fa-check text-xs"></i>
                      </button>
                      <span class={`text-xs ${t.completado ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}`}>{t.titulo}</span>
                    </div>
                    <span class="text-[10px] font-semibold text-slate-400 px-2 py-0.5 bg-slate-800 rounded-md">{t.categoria}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* RECORDATORIOS "NO OLVIDAR" */}
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">
              <h3 class="font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-note-sticky text-amber-400"></i> Recordatorios ("No olvidar")
              </h3>

              <form onSubmit={handleAddRecordatorio} class="space-y-3 bg-slate-950/40 p-4 border border-slate-800 rounded-2xl">
                <input
                  type="text"
                  placeholder="Título del recordatorio..."
                  value={newRecTitulo}
                  onChange={e => setNewRecTitulo(e.target.value)}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none"
                />
                <textarea
                  placeholder="Detalles adicionales..."
                  value={newRecDetalle}
                  onChange={e => setNewRecDetalle(e.target.value)}
                  rows="2"
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none"
                ></textarea>
                <button type="submit" class="w-full py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 text-xs font-bold rounded-xl transition">
                  Guardar Recordatorio
                </button>
              </form>

              <div class="grid grid-cols-1 gap-3">
                {data.vidaDiaria.recordatorios.map(r => (
                  <div key={r.id} class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl flex items-start justify-between">
                    <div>
                      <h4 class="font-bold text-xs text-amber-300">{r.titulo}</h4>
                      <p class="text-xs text-slate-300 mt-1">{r.detalle}</p>
                    </div>
                    <button onClick={() => deleteRecordatorio(r.id)} class="text-slate-500 hover:text-rose-400 transition text-xs">
                      <i class="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- VISTA: CALENDARIO ---
    function CalendarioView({ data }) {
      // Consolidar todos los eventos (parciales + tareas con fecha)
      const eventos = useMemo(() => {
        let evs = [];
        data.materias.forEach(m => {
          m.parciales.forEach(p => {
            if (p.fecha) {
              evs.push({ id: p.id, titulo: `${p.titulo} (${m.nombre})`, fecha: p.fecha, tipo: 'parcial', color: 'indigo' });
            }
          });
          m.tareas.forEach(t => {
            if (t.fecha) {
              evs.push({ id: t.id, titulo: `Tarea: ${t.titulo}`, fecha: t.fecha, tipo: 'tarea', color: 'emerald' });
            }
          });
        });
        return evs;
      }, [data]);

      return (
        <div class="p-8 max-w-6xl w-full mx-auto space-y-6">
          <div>
            <h2 class="text-2xl font-extrabold text-slate-100">Calendario Consolidado</h2>
            <p class="text-xs text-slate-400 mt-1">Visualizá tus fechas importantes de un vistazo.</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {eventos.map(e => (
                <div key={e.id} class={`p-4 rounded-2xl border ${e.tipo === 'parcial' ? 'bg-indigo-600/10 border-indigo-500/30' : 'bg-emerald-600/10 border-emerald-500/30'}`}>
                  <span class={`text-[10px] font-bold uppercase tracking-wider ${e.tipo === 'parcial' ? 'text-indigo-400' : 'text-emerald-400'}`}>
                    {e.tipo === 'parcial' ? 'Examen' : 'Entrega Tarea'}
                  </span>
                  <h4 class="font-bold text-sm text-slate-100 mt-1">{e.titulo}</h4>
                  <p class="text-xs text-slate-400 mt-2"><i class="fa-regular fa-calendar mr-1"></i> {e.fecha}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Renderizar App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
